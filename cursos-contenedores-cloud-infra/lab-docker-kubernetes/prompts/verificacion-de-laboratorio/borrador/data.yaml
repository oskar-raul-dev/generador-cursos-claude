apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: data}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env: [{name: POSTGRES_PASSWORD, value: p11-solo-prueba}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey, namespace: data}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: valkey}}
  template:
    metadata: {labels: {app.kubernetes.io/name: valkey}}
    spec:
      containers: [{name: valkey, image: "valkey/valkey:9.1.2"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nats, namespace: data}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: nats}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nats}}
    spec:
      containers: [{name: nats, image: "nats:2.15.0", args: ["-js"]}]
