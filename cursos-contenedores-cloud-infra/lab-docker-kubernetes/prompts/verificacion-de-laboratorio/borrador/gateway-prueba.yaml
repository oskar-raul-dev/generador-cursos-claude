apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport
    namespace: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: apps
  labels: {app.kubernetes.io/name: pricing}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: pricing}}
  template:
    metadata: {labels: {app.kubernetes.io/name: pricing}}
    spec:
      containers:
        - name: pricing
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: apps
spec:
  selector: {app.kubernetes.io/name: pricing}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pricing
  namespace: apps
spec:
  parentRefs: [{name: lab, namespace: gateway}]
  hostnames: ["api.localhost"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/pricing}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: pricing, port: 8080}]
