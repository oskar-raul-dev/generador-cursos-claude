# Tempo de un solo proceso (Fase 23): recibe spans por OTLP (HTTP en el 4318, gRPC en el 4317), los guarda en
# disco local y los sirve a Grafana en el 3200. Ningún servicio sabe que existe: le hablan a una variable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  namespace: observability
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      log_level: warn
    distributor:
      receivers:
        otlp:
          protocols:
            http: {endpoint: "0.0.0.0:4318"}
            grpc: {endpoint: "0.0.0.0:4317"}
    storage:
      trace:
        backend: local
        local: {path: /var/tempo/traces}
        wal: {path: /var/tempo/wal}
    # Tempo 3 no tiene "compactor": la compactación y la retención las hace el backend-worker.
    backend_worker:
      compaction:
        block_retention: {{ .Values.retention }}
    usage_report:
      reporting_enabled: false
