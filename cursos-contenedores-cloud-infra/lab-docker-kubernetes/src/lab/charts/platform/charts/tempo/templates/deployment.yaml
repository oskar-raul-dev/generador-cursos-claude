apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        {{- include "lab-common.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: tempo
          image: {{ .Values.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
