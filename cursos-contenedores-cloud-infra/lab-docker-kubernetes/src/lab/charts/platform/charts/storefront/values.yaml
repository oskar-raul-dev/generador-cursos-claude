# Lo que es del storefront y no cambia por perfil (Fase 13). La marca sí cambia por cadena (Fase 14).
component: frontend
replicaCount: 1
image:
  repository: lab/storefront
  tag: ""                       # lo pone task deploy desde STEP_TAGS
brandName: Droguerías La Vecina

# Las sondas (Fase 15): nginx sirviendo archivos. /config.json lo arma nginx al arrancar (G2): si
# responde, la página tiene su configuración.
probes:
  readiness: {path: /config.json, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 2}
  liveness: {path: /, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
# Recursos (Fase 15), medidos: 7 MiB en reposo y con carga. Sin límite de CPU.
resources:
  requests: {cpu: 20m, memory: 16Mi}
  limits: {memory: 32Mi}

# El ciclo de vida (Fase 16): el rollout sin bajar capacidad, el plazo para declararlo atascado, la pausa
# antes de SIGTERM, y el autoescalado, apagado por defecto (el HPA es dueño de las réplicas cuando existe).
rollout: {maxSurge: 1, maxUnavailable: 0, progressDeadlineSeconds: 120}
shutdown: {preStopSeconds: 5}
autoscaling: {enabled: false, minReplicas: 1, maxReplicas: 4, cpuPercent: 70}

# El usuario con que corre (Fase 20): el número, no el nombre que dice la imagen. Es el mismo usuario.
securityContext:
  runAsUser: 101
