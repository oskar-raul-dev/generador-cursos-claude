# storefront en el cluster: el Deployment de la Fase 11, con huecos donde cambia algo por cadena.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
spec:
  {{- include "lab-common.deploymentSpec" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "lab-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-common.podLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # El plazo entre SIGTERM y SIGKILL: el preStop más el apagado del proceso caben de sobra (Fase 16).
      terminationGracePeriodSeconds: 30
      {{- include "lab-common.podSecurity" . | nindent 6 }}
      containers:
        - name: storefront
          image: {{ include "lab-common.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "lab-common.containerSecurity" . | nindent 10 }}
          # API_BASE_URL y BRAND_NAME: el nginx de la imagen arma /config.json con ellas al arrancar.
          envFrom:
            - configMapRef:
                name: storefront-config
          ports:
            - name: http
              containerPort: 8080
          {{- include "lab-common.probes" . | trim | nindent 10 }}
          {{- include "lab-common.shutdown" . | trim | nindent 10 }}
          {{- include "lab-common.resources" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # La imagen arma su default.conf (y /config.json) al arrancar, desde una plantilla: escribe aquí.
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        # Fase 20: lo único escribible del contenedor (la raíz es de solo lectura).
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
