# La ruta del storefront (Fase 10): todo el host de la página va a la página, sin prefijo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
  hostnames: [{{ .Values.global.hosts.storefront | quote }}]
  rules:
    - backendRefs:
        - name: storefront
          port: 8080
