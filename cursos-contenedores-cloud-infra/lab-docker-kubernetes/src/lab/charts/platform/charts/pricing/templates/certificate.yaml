{{- if .Values.global.mtls.enabled }}
# G8 (Fase 19): el certificado de servidor de pricing para el mTLS, con los nombres por los que lo llama
# inventory. Lo emite y lo renueva cert-manager; el Secret pricing-tls lo monta el pod.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pricing-tls
  labels:
    {{- include "lab-common.labels" . | nindent 4 }}
spec:
  secretName: pricing-tls
  duration: 720h
  renewBefore: 240h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [server auth]
  dnsNames:
    - pricing
    - pricing.{{ .Release.Namespace }}.svc
    - pricing.{{ .Release.Namespace }}.svc.cluster.local
    # G10: el Service headless del gRPC, con el que inventory se conecta a cada réplica.
    - pricing-grpc.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.global.mtls.issuer }}
{{- end }}
