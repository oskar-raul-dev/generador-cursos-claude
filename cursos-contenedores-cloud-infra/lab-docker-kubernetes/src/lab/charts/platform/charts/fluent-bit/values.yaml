# Fluent Bit en el namespace observability (Fase 18). Lo enciende observability.logs.enabled, con Loki.
component: observability
# fluent/fluent-bit:5.1.3
image: fluent/fluent-bit@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
# De qué namespaces lee: los de las cadenas. Los nombres de los archivos de log de cada contenedor llevan
# el namespace (<pod>_<namespace>_<contenedor>-<id>.log), y el patrón elige por ahí.
namespaces: [apps, apps-b]
# Las etiquetas de cada flujo en Loki. Pocas y de pocos valores: es la regla de la Fase 17, otra vez.
labels: "job=fluent-bit, namespace=$kubernetes['namespace_name'], service=$kubernetes['labels']['app.kubernetes.io/name'], container=$kubernetes['container_name']"
resources:
  requests: {cpu: 10m, memory: 24Mi}
  limits: {memory: 96Mi}
