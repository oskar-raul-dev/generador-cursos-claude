# B-00 · Solo para medir: los datos en reposo, sin configuración de producción.
# Postgres de verdad llega en la Fase 12; Valkey y NATS, en la Parte IV.
apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: data}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722  # postgres:18.6
          env: [{name: POSTGRES_PASSWORD, value: solo-para-medir}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey, namespace: data}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: valkey}}
  template:
    metadata: {labels: {app.kubernetes.io/name: valkey}}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd  # valkey/valkey:9.1.2
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nats, namespace: data}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: nats}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nats}}
    spec:
      containers:
        - name: nats
          image: nats@sha256:cd3fcd4ecdda44e3a66728a5334af0a959bc3979b32810e033d1c547241cd0f4  # nats:2.15.0
          args: ["-js"]  # con JetStream, como en la Fase 25
