# storefront en el cluster (Fase 09): el mismo patrón que pricing en la Fase 08. Desde G2 (Fase 11),
# su configuración llega del ConfigMap storefront-config al arrancar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: apps
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: "g2"
    spec:
      containers:
        - name: storefront
          image: lab/storefront:g2
          imagePullPolicy: IfNotPresent
          # API_BASE_URL y BRAND_NAME: el nginx de la imagen arma /config.json con ellas al arrancar.
          envFrom:
            - configMapRef:
                name: storefront-config
          ports:
            - name: http
              containerPort: 8080
