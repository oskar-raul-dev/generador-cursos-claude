# La ruta del storefront (Fase 10): todo storefront.localhost va a la página.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
  namespace: apps
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: lab
spec:
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames: ["storefront.localhost"]
  rules:
    - backendRefs:
        - name: storefront
          port: 8080
