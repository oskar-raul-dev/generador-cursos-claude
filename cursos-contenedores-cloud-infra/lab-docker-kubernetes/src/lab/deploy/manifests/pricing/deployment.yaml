# pricing en el cluster. Escrito a mano en la Fase 08; desde la Fase 09 vive en `apps`; desde la 12, con Postgres (G3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  # En la Fase 08 no tenía namespace y caía en `default`; desde la Fase 09, la frontera es `apps`.
  namespace: apps
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
spec:
  # Una réplica: el perfil minimo. Las réplicas de verdad son de la Fase 16.
  replicas: 1
  # El selector usa solo el nombre: una label de más y el Deployment no encuentra sus pods (contrato §4).
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "g3"
    spec:
      containers:
        - name: pricing
          # La imagen cargada en el nodo con task images:load; el tag nombra el paso de generación.
          image: lab/pricing:g3
          # IfNotPresent: usa la del nodo. Con :latest el valor por defecto sería Always, y el nodo
          # intentaría bajarla de Docker Hub, donde no existe.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080   # el puerto del contrato (§3)
          # Las URL de los vecinos, del ConfigMap: existen y nadie las usa hasta la Fase 16.
          envFrom:
            - configMapRef:
                name: neighbors
          env:
            # G3 (Fase 12): su base en Postgres, con su usuario y su contraseña, desde su Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pricing-db, key: DATABASE_URL}
            # El tope regulado (D23), encendido desde la Fase 11; la tabla es un archivo montado.
            - name: REGULATED_CAP_ENABLED
              value: "true"
          volumeMounts:
            - name: regulated-caps
              mountPath: /etc/pricing        # regulated-caps.csv, la ruta por defecto de REGULATED_CAP_FILE
              readOnly: true
      volumes:
        - name: regulated-caps
          configMap:
            name: pricing-regulated-caps
