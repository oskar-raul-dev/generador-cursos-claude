# La ruta de inventory, escrita por su equipo (Fase 10): api.localhost/inventory/… llega a inventory sin el prefijo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory
  namespace: apps
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: lab
spec:
  # De qué puerta cuelga: el Gateway compartido, en otro namespace.
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames: ["api.localhost"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /inventory}
      filters:
        # El servicio no sabe de prefijos: /inventory/health/live le llega como /health/live.
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - name: inventory
          port: 8080
