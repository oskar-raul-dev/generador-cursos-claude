# inventory en el cluster (Fase 09): el mismo patrón que pricing en la Fase 08.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: apps
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "g3"
    spec:
      containers:
        - name: inventory
          image: lab/inventory:g3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Las URL de los vecinos, del ConfigMap: existen y nadie las usa hasta la Fase 16.
          envFrom:
            - configMapRef:
                name: neighbors
          # G3 (Fase 12): su base en Postgres, con su usuario y su contraseña, desde su Secret.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: inventory-db, key: DATABASE_URL}
