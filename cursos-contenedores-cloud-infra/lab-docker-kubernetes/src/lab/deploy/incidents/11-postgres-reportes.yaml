# Incidente 11: un Postgres para los reportes de comercial, copiado de la prueba de concepto en la nube.
# Todo está bien escrito, menos la StorageClass: oci-bv es la de los volúmenes de bloque de OCI, y en
# kind no existe. Se aplica tal cual, y nada más.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-reportes
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-reportes
    app.kubernetes.io/part-of: lab
spec:
  serviceName: postgres-reportes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-reportes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-reportes
        app.kubernetes.io/part-of: lab
    spec:
      containers:
        - name: postgres
          # postgres:18.6
          image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-users, key: POSTGRES_PASSWORD}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres-reportes
          app.kubernetes.io/part-of: lab
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 50Gi
