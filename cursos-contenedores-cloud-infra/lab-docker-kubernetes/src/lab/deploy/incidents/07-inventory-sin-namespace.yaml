# Incidente 07 (Fase 09): una copia del Deployment de inventory sin `namespace:`, con el nombre corto
# de catalog, como se escribía en compose. Aplicado sin -n, cae en el namespace del contexto: default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: inventory
          image: lab/inventory:g1
          imagePullPolicy: IfNotPresent
          env:
            - name: CATALOG_URL
              value: http://catalog:8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/inventory
      volumes:
        - name: data
          emptyDir: {}
