# La fachada del strangler (Fase 10): Contingencia contesta precios bajo su contexto, /contingencia/prices/…;
# pricing, en la raíz, /prices/…. El Gateway no puede reescribir la ruta de un solo backend, así que la
# traducción la hace este nginx, en el mismo pod que Contingencia.
server {
    listen 8081;

    location /prices/ {
        proxy_pass http://127.0.0.1:8080/contingencia/prices/;
    }
}
