# La carpeta compartida de los traslados (Fase 12): lo que en 2020 era una carpeta de SharePoint y en
# compose un volumen. Contingencia escribe, el aviso de traslados lee. ReadWriteOnce alcanza en minimo
# (un nodo); en lab, los dos pods tendrían que caer en el mismo nodo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traslados
  namespace: legacy
  labels:
    app.kubernetes.io/name: braqui
    app.kubernetes.io/part-of: lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 100Mi
