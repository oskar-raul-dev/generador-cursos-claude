# El namespace de la segunda cadena (D24, Fase 14): el mismo chart, como release tenant-b. Lo crea
# plataforma, como el de apps; el chart no crea namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: apps-b
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/instance: tenant-b
---
# La cuota de la segunda cadena (D24, Fase 15): que en su quincena no le quite la máquina a La Vecina.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps-b
  namespace: apps-b
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/instance: tenant-b
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1536Mi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: apps-b
  namespace: apps-b
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/instance: tenant-b
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 256Mi}
