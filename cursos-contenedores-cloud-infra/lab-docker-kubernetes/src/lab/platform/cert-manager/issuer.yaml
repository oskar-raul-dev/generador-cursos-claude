# El emisor del laboratorio (Fase 19): la CA de task tls:ca, guardada como Secret en cert-manager, firma
# todo lo que se le pida. Es un ClusterIssuer: sirve a cualquier namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca     # en el namespace cert-manager (el "namespace del cluster" de cert-manager)
---
# El certificado de la puerta, que reemplaza al Secret hecho a mano: el mismo nombre (lab-tls), y ahora lo
# escribe y lo renueva cert-manager. Dura un día y se renueva a las 16 horas: corto a propósito, para verlo.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-tls
  namespace: gateway
spec:
  secretName: lab-tls
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - api.localhost
    - storefront.localhost
    - grafana.localhost
    - prometheus.localhost
    - api.tenant-b.localhost
    - storefront.tenant-b.localhost
  issuerRef:
    kind: ClusterIssuer
    name: lab-ca
