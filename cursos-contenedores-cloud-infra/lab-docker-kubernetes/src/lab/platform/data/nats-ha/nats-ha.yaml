# NATS con JetStream en tres miembros (a15): el mismo bus de la Fase 25, replicado. Convive con el nats de un solo
# miembro del camino base y ninguna tarea lo aplica: kubectl apply -f platform/data/nats-ha/
# Cada miembro tiene su nombre estable (nats-ha-0, -1, -2), su DNS en el Service headless y su propio disco. Un
# stream con replicas: 3 elige un líder por quórum (2 de 3); si el líder cae, los otros dos eligen otro.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ha
  namespace: data
  labels:
    app.kubernetes.io/name: nats-ha
    app.kubernetes.io/part-of: lab
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    jetstream {
      store_dir: /data
      max_memory_store: 64MB
      max_file_store: 512MB
    }
    # Las rutas entre miembros: cada uno conoce a los tres por su nombre estable (incluido él mismo, que se ignora).
    cluster {
      name: lab-ha
      port: 6222
      routes: [
        nats://nats-ha-0.nats-ha-headless.data.svc.cluster.local:6222
        nats://nats-ha-1.nats-ha-headless.data.svc.cluster.local:6222
        nats://nats-ha-2.nats-ha-headless.data.svc.cluster.local:6222
      ]
    }
---
# El Service headless da un DNS por miembro. publishNotReadyAddresses: los miembros tienen que encontrarse ANTES de
# estar listos, porque estar listos depende de haberse encontrado.
apiVersion: v1
kind: Service
metadata:
  name: nats-ha-headless
  namespace: data
  labels:
    app.kubernetes.io/name: nats-ha
    app.kubernetes.io/part-of: lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats-ha
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: cluster, port: 6222, targetPort: cluster}
    - {name: monitor, port: 8222, targetPort: monitor}
---
# El Service de los clientes: cualquier miembro listo sirve; el cliente sigue al líder de cada stream solo.
apiVersion: v1
kind: Service
metadata:
  name: nats-ha
  namespace: data
  labels:
    app.kubernetes.io/name: nats-ha
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app.kubernetes.io/name: nats-ha
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-ha
  namespace: data
  labels:
    app.kubernetes.io/name: nats-ha
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: bus
spec:
  serviceName: nats-ha-headless
  replicas: 3
  # Parallel, no OrderedReady (el valor por defecto): con OrderedReady, nats-ha-1 espera a que nats-ha-0 esté listo,
  # y nats-ha-0 no está listo sin quórum, que necesita a nats-ha-1. Se traba solo (a15 lo mide).
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-ha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-ha
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: bus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # Un miembro por nodo cuando se puede: tres miembros en el mismo nodo caen juntos.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: nats-ha}
      containers:
        - name: nats
          # nats:2.15.0-alpine
          image: nats@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/nats/nats.conf", "--server_name", "$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 4222}
            - {name: cluster, containerPort: 6222}
            - {name: monitor, containerPort: 8222}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # /healthz contesta 200 cuando el servidor y JetStream están al día con el cluster.
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: nats-ha}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats-ha
          app.kubernetes.io/part-of: lab
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
# Fase 20: los clientes, desde los namespaces del curso; las rutas (6222), solo entre miembros.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ha
  namespace: data
  labels:
    app.kubernetes.io/part-of: lab
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nats-ha}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [apps, apps-b, data]}
      ports:
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 8222}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: nats-ha}
      ports:
        - {protocol: TCP, port: 6222}
