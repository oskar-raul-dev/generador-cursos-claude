# Postgres del sistema (Fase 12): la imagen oficial y un StatefulSet escrito a mano, sin charts de
# terceros. Una instancia con una base por servicio: la divergencia declarada del laboratorio.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: database
spec:
  # El Service headless que da a cada réplica su nombre estable.
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: database
    spec:
      # Fase 20: nunca como root. La imagen oficial arranca como root y baja a postgres (999) sola; con el
      # usuario puesto aquí arranca directamente como 999, y fsGroup deja el volumen a su nombre.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          # postgres:18.6
          image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          # Recursos (Fase 15): 54 MiB medidos con las cuatro bases. Sin ellos era BestEffort: el primero que
          # mata el kernel cuando el nodo se queda sin memoria, y con él, los cuatro servicios.
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-users, key: POSTGRES_PASSWORD}
          # Las contraseñas de los cuatro servicios, para init.sh.
          envFrom:
            - secretRef: {name: postgres-users}
          volumeMounts:
            # Postgres 18 guarda sus datos en /var/lib/postgresql/18/docker: se monta la carpeta de arriba.
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
  # El disco: un PVC por réplica, que sobrevive al pod (y al StatefulSet, si no se borra a mano).
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: lab
      spec:
        accessModes: [ReadWriteOnce]
        # La StorageClass por defecto de kind (local-path). En una nube, la del proveedor.
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
