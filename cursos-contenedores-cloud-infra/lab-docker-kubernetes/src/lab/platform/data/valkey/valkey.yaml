# Valkey (Fase 25): el pub/sub deliberadamente frágil de la coreografía. Un solo proceso, sin disco y sin
# réplicas: PUBLISH entrega a quien esté suscrito en ese instante, y a nadie más. Es justo lo que la fase
# quiere mostrar, así que no se le agrega nada que lo esconda.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: bus
    spec:
      # Fase 20: sin root. La imagen trae el usuario valkey (999).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          # valkey/valkey:9.1.2-alpine
          image: valkey/valkey@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          imagePullPolicy: IfNotPresent
          # Sin persistencia: ni RDB ni AOF. Lo que publica el pub/sub no se guarda nunca, con o sin esto.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - {name: valkey, containerPort: 6379}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
---
# Solo las cadenas del sistema llegan al 6379 (como Postgres, Fase 20).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/part-of: lab
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: valkey}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [apps, apps-b, data]}
      ports:
        - {protocol: TCP, port: 6379}
