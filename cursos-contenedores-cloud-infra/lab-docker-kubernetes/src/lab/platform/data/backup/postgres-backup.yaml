# 🔥 a13: el respaldo de Postgres. No lo aplica ninguna tarea del camino base: kubectl apply -f platform/data/backup/.
# Cada noche, un pg_dump por base en formato custom (el que pg_restore restaura por partes) y los roles aparte, en un PVC
# propio. Se guardan siete días.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: data
  labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: lab}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: {requests: {storage: 1Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: data
  labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: lab}
spec:
  schedule: "0 3 * * *"            # a las tres de la mañana, cuando nadie vende
  concurrencyPolicy: Forbid        # un respaldo a la vez: si el anterior no terminó, este no empieza
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: lab}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              # postgres:18.6, la misma imagen del servidor: pg_dump de la misma versión que la base.
              image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              env:
                - {name: PGHOST, value: postgres-0.postgres.data.svc.cluster.local}
                - {name: PGUSER, value: postgres}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: postgres-users, key: POSTGRES_PASSWORD}}
              command:
                - sh
                - -ec
                - |
                  dir=/backups/$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p "$dir"
                  pg_dumpall --globals-only > "$dir/roles.sql"
                  for db in $(psql -At -c "SELECT datname FROM pg_database WHERE datallowconn AND datname NOT IN ('postgres', 'template1')"); do
                    pg_dump -Fc -d "$db" -f "$dir/$db.dump"
                  done
                  ls -la "$dir"
                  # Siete días: lo más viejo se borra.
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
              volumeMounts: [{name: backups, mountPath: /backups}]
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: postgres-backups}
