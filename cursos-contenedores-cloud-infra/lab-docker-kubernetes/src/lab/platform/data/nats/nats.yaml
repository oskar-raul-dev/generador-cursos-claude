# NATS con JetStream (Fase 25): el bus de la coreografía en serio. JetStream guarda cada mensaje en un stream
# hasta que el consumidor confirma que lo procesó (ack); si no confirma a tiempo, se lo entrega otra vez. Un
# solo servidor en el camino base: el de tres miembros, con su quórum y su failover, es de a15.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats
  namespace: data
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: lab
data:
  nats.conf: |
    port: 4222
    # El monitoreo HTTP: /healthz para la sonda, /jsz para ver streams y consumidores sin otra herramienta.
    http_port: 8222
    jetstream {
      store_dir: /data
      # Topes del laboratorio: lo que el bus puede ocupar en memoria y en el disco del nodo.
      max_memory_store: 64MB
      max_file_store: 512MB
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: data
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: bus
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: bus
    spec:
      # Fase 20: sin root; fsGroup deja el disco de JetStream a su nombre.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nats
          # nats:2.15.0-alpine
          image: nats@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/nats/nats.conf", "--server_name", "$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: nats}
  # El stream vive en este disco: un reinicio del pod no pierde los mensajes que nadie confirmó.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/part-of: lab
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: data
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: lab
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  namespace: data
  labels:
    app.kubernetes.io/part-of: lab
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nats}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [apps, apps-b, data]}
      ports:
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 8222}
