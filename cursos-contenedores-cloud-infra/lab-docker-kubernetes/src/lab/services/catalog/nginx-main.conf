# El nginx.conf principal del contenedor nginx de catalog (G7, Fase 18). Es el de la imagen sin privilegios
# con dos cambios: los errores de nginx van a stderr desde el nivel warn (los avisos de arranque, en
# texto, rompían la regla de una línea JSON por evento) y un solo proceso trabajador, que para un pod
# con cinco hijos de FPM detrás alcanza. La configuración del sitio sigue en conf.d/default.conf.
worker_processes  1;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
