# nginx del pod de catalog: recibe en el 8080 y le pasa todo a PHP-FPM por FastCGI.

# G7: la línea de acceso en JSON, con los campos comunes. escape=json escapa comillas y barras de lo que
# venga en la petición. Los errores de nginx (error_log) no tienen formato propio: siguen siendo texto.
log_format lab_json escape=json '{"time":"$time_iso8601","level":"INFO","service":"catalog","msg":"nginx",'
    '"method":"$request_method","path":"$uri","status":$status,"request_time_s":$request_time,'
    '"request_id":"$http_x_request_id"}';

server {
    listen 8080;
    access_log /dev/stdout lab_json;

    # Un API sin archivos estáticos: cada petición la contesta Laravel.
    location / {
        # 127.0.0.1 porque FPM comparte la red con este contenedor (network_mode en compose, el pod en la Fase 09).
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
