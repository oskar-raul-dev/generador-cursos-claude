# Perfil `lab`: control-plane y dos workers, para las fases que necesitan más de un nodo.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
# Igual que en `minimo`: la confianza en registries propios se configura por carpeta (Fase 19).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # kindest/node:v1.36.4 (a01)
    image: kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Solo el control-plane publica puertos en el host; el tráfico llega a los workers por kube-proxy.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
