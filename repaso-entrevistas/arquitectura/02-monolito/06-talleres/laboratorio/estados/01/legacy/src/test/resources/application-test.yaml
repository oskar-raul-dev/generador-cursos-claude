# Las pruebas usan SQLite "porque no hace falta levantar nada" (taller 05).
spring:
  datasource:
    url: jdbc:sqlite:target/legacy-test.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
