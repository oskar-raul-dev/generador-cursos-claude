# Contrato de mono-legacy, escrito en el taller 04 DESDE LO OBSERVADO: rutas de hurl/legacy (03) y
# tráfico real, con los errores ya corregidos. Por fuera es la unión de los contratos hermanos de los
# laboratorios hexagonal y de microservicios (redeclarada aquí, no enlazada); lo que no cupo está en
# 06/04 §7.
#
# Convenciones:
#   - dinero como { amount: "49.90", currency: "USD" }; amount es texto decimal, nunca un flotante
#   - errores como application/problem+json (RFC 9457) con un `code` estable propio
#   - crear un pedido y pagarlo exigen Idempotency-Key; el legado la hace cumplir desde el taller 07
#     (x-enforced-from), y hasta entonces la acepta y la ignora
#   - paginación por cursor opaco
#   - `x-suite: v1` dice qué operaciones cubre contrato/hurl/v1
openapi: 3.1.0
info:
  title: mono-orders
  version: 1.0.0
  summary: Pedidos y pagos de mono-legacy — contrato reconstruido en el taller 04
  description: |
    API mínima de pedidos, pagos e inventario. Dos actores: `customer` (crea, paga y cancela sus
    pedidos) y `operator` (además administra el catálogo y ve todo).

    Reglas de negocio que el contrato expone y que un mock **no** implementa:
    - un pedido reserva inventario de todas sus líneas atómicamente o falla completo;
    - el pago lo decide el proveedor externo (psp-simulator): total > 1000.00 → rechazado,
      total == 666.00 → resultado incierto (pendiente), resto → autorizado;
    - un pedido rechazado sigue reservado y se puede volver a pagar o cancelar;
    - un pedido pagado no se puede cancelar; cancelar libera la reserva y produce una notificación.

servers:
  - url: http://localhost:38081
    description: mono-legacy

tags:
  - name: health
  - name: auth
  - name: products
  - name: orders
  - name: payments
  - name: cancellation
  - name: notifications
  - name: reports
    description: Consultas síncronas disfrazadas de lote; existían en el legado y se conservan
  - name: batches
    description: Registro del cierre diario (batch_runs); existía en el legado y se conserva

paths:
  /health:
    get:
      tags: [health]
      summary: Vida del proceso
      operationId: health
      x-suite: v1
      security: []
      responses:
        "200":
          description: El proceso responde
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: UP }
              example: { status: UP }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Obtener un token de acceso
      operationId: login
      x-suite: v1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: ana@mono.local, password: ana-12345 }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: Credenciales inválidas. Mismo cuerpo exista o no el correo.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Invalid credentials
                status: 401
                code: INVALID_CREDENTIALS
                instance: /api/v1/auth/login

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revocar el token actual
      description: |
        Revoca el token del `Authorization` presentado. Cualquier petición posterior con ese token
        recibe `401` con `code: TOKEN_REVOKED`. La revocación se guarda por `jti` con un TTL igual
        al tiempo de vida restante del token.
      operationId: logout
      x-suite: v1
      responses:
        "204": { description: Token revocado }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/products:
    get:
      tags: [products]
      summary: Listar el catálogo con su stock
      operationId: listProducts
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [products]
      summary: Dar de alta un producto (solo operator)
      operationId: createProduct
      x-suite: v1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
            example:
              sku: SKU-006
              name: Laptop stand
              unitPrice: { amount: "35.00", currency: USD }
              stock: 10
      responses:
        "201":
          description: Producto creado
          headers:
            Location:
              schema: { type: string }
              example: /api/v1/products/SKU-006
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
              example:
                sku: SKU-006
                name: Laptop stand
                unitPrice: { amount: "35.00", currency: USD }
                stock: 10
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ya existe un producto con ese SKU
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Product already exists
                status: 409
                code: PRODUCT_ALREADY_EXISTS
                detail: "SKU-001 already exists"
                instance: /api/v1/products

  /api/v1/products/{sku}:
    get:
      tags: [products]
      summary: Un producto con su stock
      operationId: getProduct
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/Sku"
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProductNotFound" }

  /api/v1/orders:
    get:
      tags: [orders]
      summary: Listar pedidos
      description: Un `customer` ve solo los suyos; un `operator` ve todos.
      operationId: listOrders
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [orders]
      summary: Crear un pedido reservando inventario
      description: |
        Reserva el inventario de **todas** las líneas o no crea nada. El pedido nace en estado
        `CONFIRMED` (reservado, sin pagar). Exige `Idempotency-Key`: la misma clave con el mismo
        cuerpo devuelve `200` con el pedido original y la cabecera `Idempotent-Replay: true`; la
        misma clave con otro cuerpo devuelve `422`.
      operationId: createOrder
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
            example:
              lines:
                - { sku: SKU-001, quantity: 2 }
                - { sku: SKU-002, quantity: 1 }
      responses:
        "201":
          description: Pedido creado y reservado
          headers:
            Location:
              schema: { type: string }
              example: /api/v1/orders/7c9e6679-7425-40de-944b-e07fc1f90ae7
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Repetición idempotente de una creación anterior
          headers:
            Idempotent-Replay:
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Cuerpo inválido o falta `Idempotency-Key`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                validation:
                  value:
                    type: about:blank
                    title: Validation failed
                    status: 400
                    code: VALIDATION_FAILED
                    detail: "lines must contain at least one line"
                    instance: /api/v1/orders
                    errors: [{ field: lines, message: must not be empty }]
                missingKey:
                  value:
                    type: about:blank
                    title: Idempotency-Key required
                    status: 400
                    code: IDEMPOTENCY_KEY_REQUIRED
                    instance: /api/v1/orders
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProductNotFound" }
        "409":
          description: Inventario insuficiente en al menos una línea; no se creó nada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Insufficient inventory
                status: 409
                code: INSUFFICIENT_INVENTORY
                detail: "SKU-004: requested 1, available 0"
                instance: /api/v1/orders
                errors: [{ field: "lines[0].quantity", message: "requested 1, available 0" }]
        "422":
          description: La misma `Idempotency-Key` ya se usó con otro cuerpo
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Idempotency-Key reused with a different payload
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                instance: /api/v1/orders

  /api/v1/orders/{orderId}:
    get:
      tags: [orders]
      summary: Un pedido
      description: |
        Un `customer` solo ve los suyos: el pedido de otro cliente responde `404`, no `403`, para no
        revelar su existencia. Un `operator` ve cualquiera.
      operationId: getOrder
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/OrderNotFound" }

  /api/v1/orders/{orderId}/payment:
    post:
      tags: [payments]
      summary: Autorizar el pago del pedido
      description: |
        Invoca `AuthorizePayment` contra el proveedor. Un pedido `CONFIRMED` o `PAYMENT_REJECTED` es
        pagable.
        El resultado mueve el pedido a `PAID`, `PAYMENT_REJECTED` o `PAYMENT_PENDING` (resultado
        incierto: el proveedor no respondió a tiempo; nunca se convierte en rechazo). Exige
        `Idempotency-Key`, que viaja al proveedor como clave de operación y nunca se regenera.
      operationId: authorizePayment
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Resultado del intento (autorizado, rechazado o pendiente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400":
          description: Falta `Idempotency-Key`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Idempotency-Key required
                status: 400
                code: IDEMPOTENCY_KEY_REQUIRED
                instance: /api/v1/orders/7c9e6679-7425-40de-944b-e07fc1f90ae7/payment
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409":
          description: El pedido no está en un estado pagable
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Order not payable
                status: 409
                code: ORDER_NOT_PAYABLE
                detail: "order is PAID"
                instance: /api/v1/orders/7c9e6679-7425-40de-944b-e07fc1f90ae7/payment

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [cancellation]
      summary: Cancelar un pedido y liberar su reserva
      description: |
        Solo se cancela un pedido `CONFIRMED`, `PAYMENT_REJECTED` o `PAYMENT_PENDING`; uno `PAID`
        responde `409`. Cancelar libera la reserva y deja una notificación `ORDER_CANCELLED`. Es
        idempotente: cancelar un pedido ya cancelado responde `200` sin efecto.
      operationId: cancelOrder
      x-suite: v1
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Pedido cancelado (o ya cancelado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                customerId: 11111111-1111-4111-8111-111111111111
                status: CANCELLED
                lines:
                  - sku: SKU-001
                    name: Mechanical keyboard
                    quantity: 2
                    unitPrice: { amount: "49.90", currency: USD }
                    lineTotal: { amount: "99.80", currency: USD }
                total: { amount: "99.80", currency: USD }
                payment: null
                createdAt: "2026-09-27T15:04:05Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409":
          description: El pedido está pagado y no se puede cancelar
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Order not cancellable
                status: 409
                code: ORDER_NOT_CANCELLABLE
                detail: "order is PAID"
                instance: /api/v1/orders/7c9e6679-7425-40de-944b-e07fc1f90ae7/cancel

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Notificaciones entregadas por el Notifier (solo operator)
      description: |
        Permite observar las notificaciones sin un canal real: cada fila es una entrega.
      operationId: listNotifications
      x-suite: v1
      parameters:
        - name: orderId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de notificaciones, la más reciente primero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/reports/orders-summary:
    get:
      tags: [reports]
      summary: Resumen de pedidos por cliente (solo operator)
      description: |
        Se calcula en cada petición recorriendo todos los pedidos (una consulta por pedido para leer
        el cliente). Es lento a propósito; ningún taller de este curso lo convierte en un lote real.
      operationId: getOrdersSummary
      x-suite: v1
      responses:
        "200":
          description: Una fila por cliente con pedidos, ordenada por clientId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdersSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/batches/{executionId}:
    get:
      tags: [batches]
      summary: Una ejecución del cierre diario (solo operator)
      description: |
        Lee `batch_runs`, la fila que deja `DailyCloseJob`. La forma es la de los contratos hermanos,
        con un único paso: el legado no tiene pasos ni chunks.
      operationId: getBatchExecution
      x-suite: v1
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: La ejecución y sus steps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchExecution" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No existe esa ejecución
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: about:blank
                title: Batch not found
                status: 404
                code: BATCH_NOT_FOUND
                detail: "999999"
                instance: /api/v1/batches/999999

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave elegida por el cliente, única por operación. mono-legacy la exige y la respeta desde el
        taller 07; hasta entonces la acepta y la ignora.
      x-enforced-from: "06/07"
      schema: { type: string, minLength: 8, maxLength: 128 }
      example: 6f1c2a4e-order-0001
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `nextCursor`; ausente para la primera página.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página; el servidor lo acota a 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sku:
      name: sku
      in: path
      required: true
      schema: { type: string, pattern: "^SKU-[0-9]{3,}$" }
      example: SKU-001
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

  responses:
    Unauthenticated:
      description: Sin token, token inválido, expirado o revocado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            missing:
              value:
                type: about:blank
                title: Unauthenticated
                status: 401
                code: UNAUTHENTICATED
                instance: /api/v1/orders
            revoked:
              value:
                type: about:blank
                title: Token revoked
                status: 401
                code: TOKEN_REVOKED
                instance: /api/v1/orders
    Forbidden:
      description: El actor no tiene la capacidad requerida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: FORBIDDEN
            instance: /api/v1/products
    ValidationFailed:
      description: El cuerpo no tiene la forma esperada
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            instance: /api/v1/products
            errors: [{ field: unitPrice.amount, message: must be a decimal with two digits }]
    ProductNotFound:
      description: No existe un producto con ese SKU
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Product not found
            status: 404
            code: PRODUCT_NOT_FOUND
            detail: "SKU-999"
            instance: /api/v1/products/SKU-999
    OrderNotFound:
      description: No existe el pedido, o no pertenece al actor
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Order not found
            status: 404
            code: ORDER_NOT_FOUND
            instance: /api/v1/orders/00000000-0000-4000-8000-000000000000

  schemas:
    Problem:
      description: RFC 9457 más `code`, un identificador estable para máquinas, y `errors` opcional.
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - TOKEN_REVOKED
            - FORBIDDEN
            - PRODUCT_NOT_FOUND
            - PRODUCT_ALREADY_EXISTS
            - ORDER_NOT_FOUND
            - INSUFFICIENT_INVENTORY
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - ORDER_NOT_PAYABLE
            - ORDER_NOT_CANCELLABLE
            - BATCH_NOT_FOUND
            - INTERNAL_ERROR
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          description: Decimal con dos cifras, como texto. Nunca un número flotante.
        currency: { type: string, pattern: "^[A-Z]{3}$" }
      example: { amount: "49.90", currency: USD }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vida del token, example: 900 }
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMTExMTExMS0xMTExLTQxMTEtODExMS0xMTExMTExMTExMTEiLCJyb2xlIjoiY3VzdG9tZXIiLCJqdGkiOiJkZW1vIiwiZXhwIjoxNzkwMDAwMDAwfQ.demo
        tokenType: Bearer
        expiresIn: 900

    Product:
      type: object
      required: [sku, name, unitPrice, stock]
      properties:
        sku: { type: string, pattern: "^SKU-[0-9]{3,}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        stock:
          type: integer
          minimum: 0
          description: Unidades disponibles hoy (inventario menos reservas vivas).
      example:
        sku: SKU-001
        name: Mechanical keyboard
        unitPrice: { amount: "49.90", currency: USD }
        stock: 20

    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        nextCursor:
          type: [string, "null"]
          description: Cursor de la página siguiente; `null` en la última.
      example:
        items:
          - { sku: SKU-001, name: Mechanical keyboard, unitPrice: { amount: "49.90", currency: USD }, stock: 20 }
          - { sku: SKU-002, name: USB-C cable, unitPrice: { amount: "9.90", currency: USD }, stock: 100 }
        nextCursor: U0tVLTAwMg

    CreateProductRequest:
      type: object
      required: [sku, name, unitPrice, stock]
      properties:
        sku: { type: string, pattern: "^SKU-[0-9]{3,}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        stock: { type: integer, minimum: 0 }

    CreateOrderRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string, pattern: "^SKU-[0-9]{3,}$" }
              quantity: { type: integer, minimum: 1, maximum: 1000 }

    OrderLine:
      type: object
      required: [sku, name, quantity, unitPrice, lineTotal]
      properties:
        sku: { type: string }
        name: { type: string, description: Nombre del producto en el momento de la venta }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }

    OrderStatus:
      type: string
      enum: [CONFIRMED, PAID, PAYMENT_REJECTED, PAYMENT_PENDING, CANCELLED]
      description: |
        `CONFIRMED`: reservado, sin pagar · `PAID` · `PAYMENT_REJECTED` · `PAYMENT_PENDING`:
        resultado incierto del proveedor · `CANCELLED`: reserva liberada.

    PaymentStatus:
      type: string
      enum: [AUTHORIZED, REJECTED, PENDING]

    Payment:
      type: object
      required: [status, operationId]
      properties:
        status: { $ref: "#/components/schemas/PaymentStatus" }
        operationId:
          type: string
          description: La Idempotency-Key del intento; hasta el taller 07, el identificador interno del intento
        reference: { type: [string, "null"], description: Referencia del proveedor, si la dio }

    Order:
      type: object
      required: [id, customerId, status, lines, total, payment, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        total: { $ref: "#/components/schemas/Money" }
        payment:
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
        createdAt: { type: string, format: date-time }
      example:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        customerId: 11111111-1111-4111-8111-111111111111
        status: CONFIRMED
        lines:
          - sku: SKU-001
            name: Mechanical keyboard
            quantity: 2
            unitPrice: { amount: "49.90", currency: USD }
            lineTotal: { amount: "99.80", currency: USD }
          - sku: SKU-002
            name: USB-C cable
            quantity: 1
            unitPrice: { amount: "9.90", currency: USD }
            lineTotal: { amount: "9.90", currency: USD }
        total: { amount: "109.70", currency: USD }
        payment: null
        createdAt: "2026-09-27T15:04:05Z"

    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        nextCursor: { type: [string, "null"] }
      example:
        items: []
        nextCursor: null

    PaymentResponse:
      type: object
      required: [orderId, orderStatus, payment]
      properties:
        orderId: { type: string, format: uuid }
        orderStatus: { $ref: "#/components/schemas/OrderStatus" }
        payment: { $ref: "#/components/schemas/Payment" }
      example:
        orderId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        orderStatus: PAID
        payment: { status: AUTHORIZED, operationId: 6f1c2a4e-pay-0001, reference: gw-000123 }

    Notification:
      type: object
      required: [id, orderId, type, recipient, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [ORDER_CANCELLED] }
        recipient: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: [string, "null"] }
      example:
        items:
          - id: 3d1f8c2a-1b2c-4d3e-8f4a-5b6c7d8e9f00
            orderId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            type: ORDER_CANCELLED
            recipient: ana@mono.local
            createdAt: "2026-09-27T15:10:00Z"
        nextCursor: null

    OrdersSummary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [customerId, ordersCreated, ordersCancelled, openAmount]
            properties:
              customerId: { type: string, format: uuid }
              ordersCreated: { type: integer }
              ordersCancelled: { type: integer }
              openAmount: { $ref: "#/components/schemas/Money" }

    BatchExecution:
      type: object
      required: [id, jobName, status, steps]
      properties:
        id: { type: integer, format: int64 }
        jobName: { type: string, enum: [dailyClose] }
        status: { type: string, enum: [STARTED, COMPLETED] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items:
            type: object
            required: [name, status, readCount]
            properties:
              name: { type: string }
              status: { type: string }
              readCount: { type: integer }

security:
  - bearerAuth: []
