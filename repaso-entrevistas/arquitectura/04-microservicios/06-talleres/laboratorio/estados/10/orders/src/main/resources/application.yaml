# orders (taller 04). Valores de §14 de la guía.
server:
  port: 28082

spring:
  application:
    name: ms-orders
  datasource:
    url: jdbc:postgresql://localhost:25432/ms_orders
    username: ms_orders
    password: ms-lab-pass
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  kafka:                               # taller 06
    bootstrap-servers: localhost:29092
    producer:
      acks: all                        # el broker confirma cuando el registro está en el log
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:                          # taller 08: orders también consume (los resultados de la saga)
      group-id: orders
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record                 # el offset de cada mensaje, cuando el oyente termina sin error
  grpc:
    client:
      channel:                         # singular en Boot 4; `channels` se ignora en silencio
        inventory:
          target: static://localhost:28193   # `target`, no `address`; a través de Toxiproxy (proxy `inventory-grpc`)

# taller 05: liveness y readiness. La readiness dice "puedo atender tráfico": depende de lo MÍO (mi
# base), no de mis dependencias. `payments` existe como indicador, pero NO está en el grupo: meterlo
# es la provocación (lab.py orders --readiness-includes-payments).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

ms:
  events:                              # taller 06
    topic: orders.events
    mode: outbox                       # outbox: misma transacción + publicador · direct: publicar tras el commit (provocación)
    chaos: none                        # crash-before-publish: en modo direct, la JVM muere entre el commit y el envío
    poll-ms: 200
    propagate-trace: true              # taller 07: el contexto de la traza viaja en la fila del outbox (false = la provocación)
  saga:                                # taller 08
    placed-topic: orders.placed
    retry-on-release: false            # true = la provocación del ciclo (06/08 §8)
    mode: orchestration                # taller 09: orchestration (orders manda) · choreography (la de 06/08)
    step-deadline-seconds: 20          # plazo de cada paso del orquestador; 0 = sin plazo (la provocación de 06/09 §7)
    poll-ms: 200
  v1:                                  # taller 08: Deprecation y Sunset en /api/v1/orders
    deprecated-at: 2026-09-29T00:00:00Z
    sunset-at: 2027-03-31T00:00:00Z
  catalog:
    base-url: http://localhost:28081   # el monolito conserva catalog y customers
    read-timeout-ms: 800
  inventory:
    deadline-ms: 800                   # plazo por llamada gRPC; viaja en la llamada (grpc-timeout)
  payments:
    base-url: http://localhost:28184
    connect-timeout-ms: 500
    read-timeout-ms: 2500
    propagate-key: true
    retry:
      max-attempts: 3
      base-backoff-ms: 200
    bulkhead:
      max-concurrent: 4                # llamadas a payments a la vez; la quinta se rechaza (taller 05)
    breaker:
      window: 10
      minimum-calls: 4
      failure-rate: 50
      open-seconds: 10
      half-open-calls: 2

# taller 07: el agente de OpenTelemetry deja trace_id y span_id en el MDC de cada línea de log;
# este patrón los imprime. Sin agente, el hueco sale vacío.
logging:
  pattern:
    correlation: "[trace=%X{trace_id:-} span=%X{span_id:-}] "
