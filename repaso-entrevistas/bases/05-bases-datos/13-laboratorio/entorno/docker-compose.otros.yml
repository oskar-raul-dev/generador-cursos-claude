# Los motores del bloque 09 y de `l05`. Van aparte del `compose` principal porque pesan:
# se levantan solo cuando hacen falta, y de uno en uno si la maquina va justa de memoria.
#
# Versiones fijas y verificadas: ver `prompts/dominio-entorno-y-datos-fijos.md` §4.5.
#
#   docker compose -f docker-compose.otros.yml --profile otros up -d cassandra
#   docker compose -f docker-compose.otros.yml --profile otros down -v     teardown, con volumenes

name: bd-lab-otros

services:

  cassandra:
    image: cassandra:5.0.9
    container_name: bd-lab-cassandra
    profiles: ["otros"]
    environment:
      MAX_HEAP_SIZE: 512M          # por defecto toma una fraccion de la memoria de la maquina
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  neo4j:
    image: neo4j:5.26.31-community
    container_name: bd-lab-neo4j
    profiles: ["otros"]
    environment:
      NEO4J_AUTH: neo4j/tienda_neo4j   # la imagen exige al menos ocho caracteres
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"                    # navegador web
      - "7687:7687"                    # protocolo Bolt, el de los drivers y cypher-shell
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tienda_neo4j 'RETURN 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  timescale:
    # PostgreSQL 18.6, el mismo del corpus, con TimescaleDB y pgvector en la imagen
    image: timescale/timescaledb-ha:pg18.6-ts2.30.1
    container_name: bd-lab-timescale
    profiles: ["otros"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda
    ports:
      - "5433:5432"                    # el 5432 es del PostgreSQL principal
    volumes:
      - timescaledata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: bd-lab-opensearch
    profiles: ["otros"]
    environment:
      discovery.type: single-node      # un nodo solo: sin esto espera a formar un cluster
      DISABLE_SECURITY_PLUGIN: "true"  # lab local: sin TLS ni usuarios
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: bd-lab-qdrant
    profiles: ["otros"]
    ports:
      - "6333:6333"                    # API REST
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cassandradata:
  neo4jdata:
  timescaledata:
  opensearchdata:
  qdrantdata:
