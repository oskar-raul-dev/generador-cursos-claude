[project]
name = "aur"
version = "0.7.0"
description = "La caja de herramientas de Patricia: cierre de mes de la red Áurea."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
aur = "aur.cli:main"

[dependency-groups]
dev = ["ruff==0.16.7", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100
