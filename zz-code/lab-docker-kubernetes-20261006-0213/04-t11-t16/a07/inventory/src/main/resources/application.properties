spring.application.name=inventory
# El puerto lo fija la plataforma; 8080 por defecto, como en todo el laboratorio.
server.port=${PORT:8080}
# El almacén lo arma StoreConfig (G3): Postgres si hay DATABASE_URL, SQLite en DATA_DIR si no.
# Las migraciones son de Migrator, no de Spring: con Postgres las corre el Job, no el arranque.
spring.sql.init.mode=never
# G5: el apagado limpio. Ante SIGTERM, Tomcat deja de aceptar conexiones y espera hasta 20 s a que
# terminen las que están en vuelo; menos que los 30 s de terminationGracePeriodSeconds del pod.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# G6: Actuator solo para las métricas, y en la ruta del contrato: /metrics, no /actuator/prometheus.
# Ningún otro endpoint de Actuator queda expuesto (la salud sigue siendo la de HealthController).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
# Sin esto, Micrometer publica un resumen (count, sum y max) y no hay histograma del cual sacar un p95.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# G7: el log en JSON, una línea por evento a stdout. Spring Boot lo trae (formato logstash); se renombra
# y se recorta para que tenga los mismos campos que los otros tres: time, level, service y msg.
logging.structured.format.console=logstash
logging.structured.json.rename[@timestamp]=time
logging.structured.json.rename.message=msg
logging.structured.json.exclude=@version,level_value,thread_name,logger_name,tags
logging.structured.json.add.service=inventory
# El banner de arranque es texto en stdout: rompería la regla de una línea JSON por evento.
spring.main.banner-mode=off
