apiVersion: v1
kind: Namespace
metadata: {name: observability}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: observability}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
      - job_name: prometheus
        static_configs: [{targets: ["localhost:9090"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.4
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      containers: [{name: grafana, image: "grafana/grafana:13.2.3"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: observability}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loki}}
    spec:
      containers: [{name: loki, image: "grafana/loki:3.7.8", args: ["-config.file=/etc/loki/local-config.yaml"]}]
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: observability}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports: [{port: 3100}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit, namespace: observability}
data:
  fluent-bit.yaml: |
    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/*.log
          parser: cri
          tag: kube.*
      outputs:
        - name: loki
          match: "*"
          host: loki.observability.svc.cluster.local
          port: 3100
          labels: job=fluent-bit
  parsers.yaml: |
    parsers:
      - name: cri
        format: regex
        regex: '^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$'
        time_key: time
        time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluent-bit, namespace: observability}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: fluent-bit}}
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.3
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml", "-R", "/fluent-bit/etc/conf/parsers.yaml"]
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/conf}
            - {name: varlog, mountPath: /var/log, readOnly: true}
      volumes:
        - {name: config, configMap: {name: fluent-bit}}
        - {name: varlog, hostPath: {path: /var/log}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tempo, namespace: observability}
data:
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols: {grpc: {endpoint: "0.0.0.0:4317"}, http: {endpoint: "0.0.0.0:4318"}}
    storage:
      trace:
        backend: local
        local: {path: /var/tempo/traces}
        wal: {path: /var/tempo/wal}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: observability}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: tempo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tempo}}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.1.0
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          volumeMounts: [{name: config, mountPath: /etc/tempo}, {name: data, mountPath: /var/tempo}]
      volumes: [{name: config, configMap: {name: tempo}}, {name: data, emptyDir: {}}]
