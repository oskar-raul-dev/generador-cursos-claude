# Source: platform/charts/catalog/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: lab
    app.kubernetes.io/managed-by: Helm
spec:
  # De qué puerta cuelga: el Gateway compartido, en su namespace.
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames: ["api.localhost"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /catalog}
      filters:
        # El servicio no sabe de prefijos: /catalog/health/live le llega como /health/live.
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
        # La página del storefront vive en otro origen: el navegador solo le entrega la respuesta si la
        # puerta lo autoriza (HTTPRouteCORS, soporte extendido).
        - type: CORS
          cors:
            allowOrigins: ["http://storefront.localhost:8080"]
            allowMethods: ["GET"]
      backendRefs:
        - name: catalog
          port: 8080

