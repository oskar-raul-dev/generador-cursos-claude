---
# Source: platform/charts/catalog/templates/configmap.yaml
# El nginx.conf de catalog, desde files/ del chart. Es un enlace simbólico a services/catalog/nginx.conf:
# una sola fuente, la misma que usa compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-nginx
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: lab
    app.kubernetes.io/managed-by: Helm
data:
  default.conf: |
    # nginx del pod de catalog: recibe en el 8080 y le pasa todo a PHP-FPM por FastCGI.
    server {
        listen 8080;
    
        # Un API sin archivos estáticos: cada petición la contesta Laravel.
        location / {
            # 127.0.0.1 porque FPM comparte la red con este contenedor (network_mode en compose, el pod en la Fase 09).
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }
    

