    # Un hook: Helm lo aplica antes del resto, en cada install y en cada upgrade, y espera a que
    # termine. Si falla, el release falla y ningún Deployment se toca.
    "helm.sh/hook": pre-install,pre-upgrade
    # Los cuatro con el mismo peso: Helm los corre de a uno, en orden por nombre.
    "helm.sh/hook-weight": "0"
    # El Job anterior se borra justo antes de crear el nuevo: un Job no se puede volver a aplicar
    # (Fase 12), y así su log se puede leer hasta el próximo despliegue.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Dos reintentos: el primero suele ser Postgres que todavía no acepta conexiones.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: replenish
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: migration
        app.kubernetes.io/instance: lab
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: lab/replenish:g3
          imagePullPolicy: IfNotPresent
          command: ["node","dist/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: replenish-db, key: DATABASE_URL}

---
# Source: platform/templates/seed-job.yaml
# El seed (Fase 12): generate.py y load.py de a01, como Job. Helm lo corre DESPUÉS de instalar, y solo
# al instalar: en un upgrade, los datos ya están. Carga por la API: el seed no conoce ninguna tabla.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/instance: lab
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: lab
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: lab/seed:g3
          imagePullPolicy: IfNotPresent
          env:
            - {name: STORES, value: "20"}
          envFrom:
            - configMapRef: {name: neighbors}

