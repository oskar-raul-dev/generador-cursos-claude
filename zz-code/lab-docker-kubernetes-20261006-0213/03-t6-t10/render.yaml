# Source: platform/charts/catalog/templates/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: migration
    app.kubernetes.io/instance: lab
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Un hook: Helm lo aplica antes del resto, en cada install y en cada upgrade, y espera a que
    # termine. Si falla, el release falla y ningún Deployment se toca.
    "helm.sh/hook": pre-install,pre-upgrade
    # Los cuatro con el mismo peso: Helm los corre de a uno, en orden por nombre.
    "helm.sh/hook-weight": "0"
    # El Job anterior se borra justo antes de crear el nuevo: un Job no se puede volver a aplicar
    # (Fase 12), y así su log se puede leer hasta el próximo despliegue.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Dos reintentos: el primero suele ser Postgres que todavía no acepta conexiones.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: migration
        app.kubernetes.io/instance: lab
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: lab/catalog:g3
          imagePullPolicy: IfNotPresent
          command: ["php","artisan","migrate","--force","--no-interaction"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: catalog-db, key: DATABASE_URL}

