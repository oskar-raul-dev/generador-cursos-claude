---
# Source: platform/charts/catalog/templates/deployment.yaml
# catalog en el cluster: un pod, dos contenedores (D34). No sigue la plantilla de los otros: es el
# único con dos procesos, y la diferencia queda a la vista en vez de esconderse en un parámetro.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: lab
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: lab
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: lab
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "g3"
      annotations:
        # Si cambia el nginx.conf, cambia el pod (el mismo truco que los topes de pricing).
        checksum/nginx: eea8563a16a340e18e4a047bb436d60129cff138a26fda84e303b2041d54e42f
    spec:
      containers:
        # PHP-FPM con la aplicación: FastCGI en 127.0.0.1:9000, que en un pod es la misma red del nginx.
        - name: php-fpm
          image: lab/catalog:g3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: neighbors
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: catalog-db, key: DATABASE_URL}
        # nginx delante, en el 8080: el que recibe el tráfico del Service.
        - name: nginx
          image: nginxinc/nginx-unprivileged@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d   # el default.conf del ConfigMap reemplaza al de la imagen
      volumes:
        - name: nginx-conf
          configMap:
            name: catalog-nginx

