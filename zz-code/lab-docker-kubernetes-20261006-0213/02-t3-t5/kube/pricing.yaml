apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  labels:
    app.kubernetes.io/name: pricing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
    spec:
      containers:
        - name: pricing
          image: lab/pricing
          ports:
            - containerPort: 8080
              hostPort: 18080
